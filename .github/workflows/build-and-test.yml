name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

permissions:
  contents: read

# Own job instead of the GTNH shared workflow: that one only installs JDK 8/17/21, while this build needs JVM 25
# (gtnhsettingsconvention 2.0.29 is compiled for it and Gradle refuses to load the plugin on an older JVM), so the
# shared workflow died in "Setup the workspace" before it ever compiled anything - see release-tags.yml for the
# same reason on the release side.
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout mod repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 32
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup the workspace and build
        run: ./gradlew --build-cache setupCIWorkspace build -x test

      # the jar of every push is downloadable from the run's artifacts, so a build can be tested
      # without creating a release tag first
      - name: Upload the built jar
        uses: actions/upload-artifact@v4
        with:
          name: gt6scan-jar
          path: build/libs/*.jar
          if-no-files-found: error
